[project]
name = "paper-trail-lab"
version = "0.0.0"
description = "Paper Trail Lab: independent, pre-registered testing of AI trading tools."
requires-python = ">=3.9"
dependencies = [
    "pyrage>=1.3.0",
]

[project.optional-dependencies]
agent-a = [
    "tradingagents ; python_full_version >= '3.11'",
]

[dependency-groups]
dev = ["pytest>=8"]
timestamp = [
    "opentimestamps-client>=0.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tradingagents = { git = "https://github.com/TauricResearch/TradingAgents", rev = "c4544913a14ed3df5f1ed7b9e8483270ce20682a" }
