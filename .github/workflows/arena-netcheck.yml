# One-off check that A's data sources (Reddit, FRED) respond from GitHub Actions. No LLM calls.
# Manual trigger only.
name: arena-netcheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install (TradingAgents needs Python >= 3.11)
        run: uv sync --frozen --python 3.12 --extra agent-a
      - name: Probe Reddit and FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run --python 3.12 python -m arena.netcheck
